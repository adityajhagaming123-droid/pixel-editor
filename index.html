<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixeledit — Pixel Art &amp; Sprite Studio for Unity 2D</title>
  <meta name="description" content="A pixel art and sprite animation editor for Unity 2D games that runs in your browser: game asset templates, animation tags, pivots, one-click Unity export (sliced sprites, animation clips, Animator) and a Claude AI assistant.">
  <meta name="theme-color" content="#15161c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%2315161c'/%3E%3Cpath fill='%236c8cff' d='M1 1h4v1H1zM1 2h1v5H1zM5 2h1v2H5zM2 4h3v1H2z'/%3E%3Cpath fill='%23ff5c7a' d='M5 5h2v2H5z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Menu bar -->
    <header class="menubar">
      <div class="brand"><span class="brand-logo" aria-hidden="true"></span><span class="brand-name">Pixeledit</span></div>
      <button class="icon-btn menu-all" id="menu-all" aria-label="Menu" aria-haspopup="true"><i data-icon="menu"></i></button>
      <nav class="menus" id="menus" aria-label="Main menu"></nav>
      <div class="doc-name-wrap">
        <input id="doc-name" class="doc-name" spellcheck="false" aria-label="Sprite name" title="Sprite name — click to rename">
      </div>
      <div class="menubar-actions">
        <button class="icon-btn" data-cmd="undo" aria-label="Undo"><i data-icon="undo"></i></button>
        <button class="icon-btn" data-cmd="redo" aria-label="Redo"><i data-icon="redo"></i></button>
        <span class="vsep"></span>
        <button class="btn btn-claude" data-cmd="claude" aria-label="Claude assistant" title="Claude assistant — draw, animate, edit and review sprites (Alt+A)"><i data-icon="claude"></i><span class="hide-sm">Claude</span></button>
        <button class="btn" data-cmd="exportPng" aria-label="Export" title="Export PNG, spritesheet or GIF (Ctrl+E)"><i data-icon="download"></i><span class="hide-sm">Export</span></button>
        <button class="btn btn-accent" data-cmd="exportUnity" aria-label="Export for Unity" title="Export for Unity — sliced sprite sheet, animation clips and Animator (Ctrl+Shift+U)"><i data-icon="cube"></i><span class="hide-sm">Unity</span></button>
        <button class="icon-btn" data-cmd="togglePanels" aria-label="Toggle side panels"><i data-icon="panel"></i></button>
      </div>
    </header>

    <!-- Contextual tool options -->
    <div class="optionsbar" id="optionsbar"></div>

    <div class="main">
      <!-- Tools -->
      <nav class="toolbar" id="toolbar" aria-label="Tools"></nav>

      <!-- Canvas -->
      <section class="workspace" id="workspace">
        <canvas id="view" class="view" aria-label="Drawing canvas"></canvas>
        <div class="zoom-hud">
          <button class="icon-btn sm" data-cmd="zoomOut" aria-label="Zoom out"><i data-icon="minus"></i></button>
          <button class="zoom-label" id="zoom-label" data-cmd="zoomFit" title="Fit to screen (0)">100%</button>
          <button class="icon-btn sm" data-cmd="zoomIn" aria-label="Zoom in"><i data-icon="plus"></i></button>
          <span class="vsep"></span>
          <button class="icon-btn sm" data-cmd="toggleGrid" aria-label="Toggle pixel grid"><i data-icon="grid"></i></button>
          <button class="icon-btn sm" data-cmd="toggleTimeline" aria-label="Toggle timeline"><i data-icon="timeline"></i></button>
        </div>
      </section>

      <!-- Side panels -->
      <aside class="sidepanel" id="sidepanel" aria-label="Panels">
        <section class="panel" data-panel="color">
          <button class="panel-head"><span>Color</span><i data-icon="chevronDown" class="chev"></i></button>
          <div class="panel-body">
            <div class="color-head">
              <div class="color-pair">
                <button class="big-swatch" id="sw-primary" title="Primary color — left click. Click to edit."><span></span></button>
                <button class="big-swatch secondary" id="sw-secondary" title="Secondary color — right click. Click to edit."><span></span></button>
              </div>
              <div class="color-head-actions">
                <button class="icon-btn sm" data-cmd="swapColors" aria-label="Swap colors"><i data-icon="swap"></i></button>
                <button class="icon-btn sm" data-cmd="resetColors" aria-label="Reset colors"><i data-icon="reset"></i></button>
              </div>
              <input id="hex-input" class="hex-input" spellcheck="false" maxlength="11" aria-label="Hex color">
            </div>
            <div class="sv" id="sv"><div class="sv-thumb" id="sv-thumb"></div></div>
            <div class="hue-bar" id="hue-bar" aria-label="Hue"><div class="bar-thumb" id="hue-thumb"></div></div>
            <div class="alpha-bar" id="alpha-bar" aria-label="Opacity"><div class="alpha-fill" id="alpha-fill"></div><div class="bar-thumb" id="alpha-thumb"></div></div>
            <div class="rgba-row">
              <label>R<input type="number" id="in-r" min="0" max="255"></label>
              <label>G<input type="number" id="in-g" min="0" max="255"></label>
              <label>B<input type="number" id="in-b" min="0" max="255"></label>
              <label>A<input type="number" id="in-a" min="0" max="255"></label>
            </div>
            <div class="sub-label">Recent</div>
            <div class="recent" id="recent-colors"></div>
          </div>
        </section>

        <section class="panel" data-panel="palette">
          <button class="panel-head"><span>Palette</span><i data-icon="chevronDown" class="chev"></i></button>
          <div class="panel-body">
            <select id="palette-select" class="input sm" aria-label="Palette preset"></select>
            <div class="palette-grid" id="palette-grid"></div>
            <div class="panel-actions">
              <button class="icon-btn sm" id="pal-add" title="Add primary color to the palette"><i data-icon="plus"></i></button>
              <button class="icon-btn sm" id="pal-remove" title="Remove the selected swatch"><i data-icon="minus"></i></button>
              <button class="icon-btn sm" id="pal-extract" title="Build a palette from the colors used in the sprite"><i data-icon="pipette"></i></button>
              <button class="icon-btn sm" id="pal-sort" title="Sort by hue and lightness"><i data-icon="sort"></i></button>
              <span class="grow"></span>
              <button class="icon-btn sm" id="pal-import" title="Import palette (.hex, .gpl, .txt or image)"><i data-icon="upload"></i></button>
              <button class="icon-btn sm" id="pal-export" title="Export palette (.hex)"><i data-icon="download"></i></button>
            </div>
          </div>
        </section>

        <section class="panel" data-panel="layers">
          <button class="panel-head"><span>Layers</span><i data-icon="chevronDown" class="chev"></i></button>
          <div class="panel-body">
            <div class="layer-props">
              <span class="mini-label">Opacity</span>
              <input type="range" class="range" id="layer-opacity" min="0" max="100" value="100" aria-label="Layer opacity">
              <span class="mini-val" id="layer-opacity-val">100%</span>
              <select id="layer-blend" class="input sm" aria-label="Blend mode"></select>
            </div>
            <div class="layer-list" id="layer-list"></div>
            <div class="panel-actions">
              <button class="icon-btn sm" data-cmd="newLayer" aria-label="New layer"><i data-icon="plus"></i></button>
              <button class="icon-btn sm" data-cmd="duplicateLayer" aria-label="Duplicate layer"><i data-icon="copy"></i></button>
              <button class="icon-btn sm" data-cmd="mergeDown" aria-label="Merge down"><i data-icon="merge"></i></button>
              <button class="icon-btn sm" data-cmd="layerUp" aria-label="Move layer up"><i data-icon="chevronUp"></i></button>
              <button class="icon-btn sm" data-cmd="layerDown" aria-label="Move layer down"><i data-icon="chevronDown"></i></button>
              <button class="icon-btn sm" data-cmd="toggleLayerGuide" aria-label="Toggle guide layer" title="Guide layer — visible while editing, never exported"><i data-icon="guide"></i></button>
              <span class="grow"></span>
              <button class="icon-btn sm danger" data-cmd="deleteLayer" aria-label="Delete layer"><i data-icon="trash"></i></button>
            </div>
          </div>
        </section>

        <section class="panel" data-panel="preview">
          <button class="panel-head"><span>Preview</span><i data-icon="chevronDown" class="chev"></i></button>
          <div class="panel-body">
            <div class="preview-wrap"><canvas id="preview-canvas"></canvas></div>
            <div class="panel-actions">
              <button class="icon-btn sm" id="preview-play" title="Play the animation in the preview only"><i data-icon="play"></i></button>
              <span class="preview-info" id="preview-info"></span>
              <span class="grow"></span>
              <select id="preview-scale" class="input sm" aria-label="Preview scale">
                <option value="0">Fit</option>
                <option value="1">1×</option>
                <option value="2">2×</option>
                <option value="4">4×</option>
              </select>
            </div>
          </div>
        </section>
      </aside>
    </div>

    <!-- Timeline -->
    <footer class="timeline" id="timeline">
      <div class="timeline-bar">
        <div class="tl-group">
          <button class="icon-btn" data-cmd="firstFrame" aria-label="First frame"><i data-icon="skipBack"></i></button>
          <button class="icon-btn" data-cmd="prevFrame" aria-label="Previous frame"><i data-icon="chevronLeft"></i></button>
          <button class="icon-btn play-btn" id="btn-play" data-cmd="play" aria-label="Play or pause"><i data-icon="play"></i></button>
          <button class="icon-btn" data-cmd="nextFrame" aria-label="Next frame"><i data-icon="chevronRight"></i></button>
          <button class="icon-btn" data-cmd="lastFrame" aria-label="Last frame"><i data-icon="skipForward"></i></button>
        </div>
        <div class="tl-group">
          <span class="tl-counter" id="frame-counter">1 / 1</span>
          <label class="tl-field" title="Duration of the current frame">
            <input type="number" id="frame-duration" class="input sm" min="10" max="10000" step="10" aria-label="Frame duration in milliseconds"><span>ms</span>
          </label>
          <select id="loop-mode" class="input sm" aria-label="Loop mode">
            <option value="loop">Loop</option>
            <option value="pingpong">Ping-pong</option>
          </select>
        </div>
        <div class="tl-group">
          <button class="btn toggle" id="btn-onion" data-cmd="toggleOnion"><i data-icon="layers"></i><span>Onion skin</span></button>
          <button class="icon-btn" id="btn-onion-settings" title="Onion skin settings" aria-label="Onion skin settings"><i data-icon="settings"></i></button>
        </div>
        <div class="tl-group">
          <button class="btn toggle" data-cmd="newTag" title="New animation tag from the current frame or a Shift+clicked range (Alt+T)"><i data-icon="tag"></i><span>Tag</span></button>
        </div>
        <div class="tl-group tl-right">
          <button class="icon-btn" data-cmd="newFrame" aria-label="New frame"><i data-icon="plus"></i></button>
          <button class="icon-btn" data-cmd="duplicateFrame" aria-label="Duplicate frame"><i data-icon="copy"></i></button>
          <button class="icon-btn" data-cmd="frameLeft" aria-label="Move frame left"><i data-icon="arrowLeft"></i></button>
          <button class="icon-btn" data-cmd="frameRight" aria-label="Move frame right"><i data-icon="arrowRight"></i></button>
          <button class="icon-btn danger" data-cmd="deleteFrame" aria-label="Delete frame"><i data-icon="trash"></i></button>
        </div>
      </div>
      <div class="frames" id="frames"></div>
    </footer>

    <!-- Status bar -->
    <div class="statusbar">
      <span class="st-hint" id="st-hint"></span>
      <span class="st-spacer"></span>
      <span id="st-pos" class="st-item mono">–</span>
      <span id="st-color" class="st-item st-color mono" hidden><i class="chip"></i><span></span></span>
      <span id="st-sel" class="st-item mono" hidden></span>
      <span id="st-size" class="st-item mono"></span>
      <span id="st-save" class="st-item st-save"></span>
    </div>
  </div>

  <div id="dropdown-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="drop-overlay" class="drop-overlay"><div class="drop-card"><i data-icon="upload"></i><span>Drop an image or a .pxl project</span></div></div>
  <input type="file" id="file-open" accept=".pxl,.json,image/*" hidden>
  <input type="file" id="file-palette" accept=".hex,.gpl,.txt,image/*" hidden>

  <script src="js/util.js"></script>
  <script src="js/palettes.js"></script>
  <script src="js/gif.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/unity.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/claude.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
